<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-label="Insert code block dialog">
  <style>.t{font-family:Segoe UI,Microsoft YaHei,sans-serif}.m{font-family:Consolas,Menlo,monospace}</style>
  <rect width="880" height="560" fill="#EEF1F4"/>
  <!-- window -->
  <rect x="30" y="24" width="820" height="512" rx="12" fill="#ffffff" stroke="#C9D1D9"/>
  <rect x="30" y="24" width="820" height="40" rx="12" fill="#7719AA"/>
  <rect x="30" y="48" width="820" height="16" fill="#7719AA"/>
  <text x="52" y="51" class="t" font-size="15" font-weight="600" fill="#ffffff">插入代码块 Insert Code Block — OneExtend</text>
  <text x="824" y="51" class="m" font-size="13" fill="#ffffff" opacity="0.85">─ □ ✕</text>

  <!-- left: language list -->
  <rect x="46" y="82" width="176" height="436" rx="8" fill="#FAFBFC" stroke="#E6E9EE"/>
  <rect x="58" y="94" width="152" height="26" rx="6" fill="#ffffff" stroke="#D0D7DE"/>
  <text x="66" y="112" class="t" font-size="12.5" fill="#8B949E">🔍 搜索语言…</text>
  <text x="58" y="146" class="t" font-size="11" fill="#57606A" font-weight="700">最近使用</text>
  <rect x="46" y="152" width="176" height="24" fill="#F5EEFB"/>
  <rect x="218" y="152" width="4" height="24" fill="#7719AA"/>
  <text x="62" y="169" class="t" font-size="12.5" fill="#5B1485" font-weight="700">★ PL/SQL (Oracle)</text>
  <text x="62" y="193" class="t" font-size="12.5" fill="#3C424B">★ SQL (ANSI)</text>
  <text x="62" y="217" class="t" font-size="12.5" fill="#3C424B">★ React (JSX/TSX)</text>
  <text x="58" y="243" class="t" font-size="11" fill="#57606A" font-weight="700">全部语言</text>
  <text x="62" y="267" class="t" font-size="12.5" fill="#3C424B">CSS</text>
  <text x="62" y="291" class="t" font-size="12.5" fill="#3C424B">HTML</text>
  <text x="62" y="315" class="t" font-size="12.5" fill="#3C424B">Java</text>
  <text x="62" y="339" class="t" font-size="12.5" fill="#3C424B">JavaScript (Node.js)</text>
  <text x="62" y="363" class="t" font-size="12.5" fill="#3C424B">SQL (MySQL)</text>
  <text x="62" y="387" class="t" font-size="12.5" fill="#3C424B">SQL (T-SQL)</text>
  <text x="62" y="411" class="t" font-size="12.5" fill="#3C424B">TypeScript</text>
  <text x="62" y="435" class="t" font-size="12.5" fill="#8B949E">＋ 导入语法包…</text>

  <!-- title row -->
  <text x="248" y="104" class="t" font-size="13" fill="#3C424B">名称</text>
  <rect x="288" y="88" width="380" height="26" rx="6" fill="#ffffff" stroke="#D0D7DE"/>
  <text x="298" y="106" class="m" font-size="13" fill="#24292F">get_orders.sql</text>
  <rect x="680" y="88" width="70" height="24" rx="12" fill="#FDEEE0"/>
  <text x="715" y="105" text-anchor="middle" class="t" font-size="11.5" font-weight="700" fill="#C2410C">PL/SQL</text>
  <text x="758" y="106" class="t" font-size="11.5" fill="#1A7F37">✓ 自动识别</text>

  <!-- editor -->
  <rect x="248" y="126" width="550" height="180" rx="8" fill="#1E1E2E"/>
  <g class="m" font-size="12.5">
    <text x="262" y="150" fill="#6C7086" text-anchor="end">1</text>
    <text x="272" y="150" fill="#313244">│</text>
    <text x="286" y="150" fill="#008000" xml:space="preserve">-- 查询近 30 天已支付订单</text>
    <text x="262" y="171" fill="#6C7086" text-anchor="end">2</text>
    <text x="272" y="171" fill="#313244">│</text>
    <text x="286" y="171" fill="#89B4FA"><tspan font-weight="bold">DECLARE</tspan></text>
    <text x="262" y="192" fill="#6C7086" text-anchor="end">3</text>
    <text x="272" y="192" fill="#313244">│</text>
    <text x="286" y="192" fill="#CDD6F4" xml:space="preserve">   v_total <tspan fill="#FAB387">NUMBER</tspan> <tspan fill="#94E2D5">:=</tspan> <tspan fill="#FAB387">0</tspan>;</text>
    <text x="262" y="213" fill="#6C7086" text-anchor="end">4</text>
    <text x="272" y="213" fill="#313244">│</text>
    <text x="286" y="213" fill="#89B4FA"><tspan font-weight="bold">BEGIN</tspan></text>
    <text x="262" y="234" fill="#6C7086" text-anchor="end">5</text>
    <text x="272" y="234" fill="#313244">│</text>
    <text x="286" y="234" fill="#CDD6F4" xml:space="preserve">   <tspan fill="#CBA6F7">FOR</tspan> rec <tspan fill="#89B4FA">IN</tspan> (<tspan fill="#89B4FA">SELECT</tspan> amount <tspan fill="#89B4FA">FROM</tspan> orders</text>
    <text x="262" y="255" fill="#6C7086" text-anchor="end">6</text>
    <text x="272" y="255" fill="#313244">│</text>
    <text x="286" y="255" fill="#CDD6F4" xml:space="preserve">                   <tspan fill="#89B4FA">WHERE</tspan> status <tspan fill="#94E2D5">=</tspan> <tspan fill="#A6E3A1">'PAID'</tspan>) <tspan fill="#89B4FA">LOOP</tspan></text>
    <text x="262" y="276" fill="#6C7086" text-anchor="end">7</text>
    <text x="272" y="276" fill="#313244">│</text>
    <text x="286" y="276" fill="#CDD6F4" xml:space="preserve">      v_total <tspan fill="#94E2D5">:=</tspan> v_total <tspan fill="#94E2D5">+</tspan> rec.amount;</text>
    <text x="262" y="297" fill="#6C7086" text-anchor="end">8</text>
    <text x="272" y="297" fill="#313244">│</text>
    <text x="286" y="297" fill="#CDD6F4" xml:space="preserve">   <tspan fill="#89B4FA">END LOOP</tspan>;  <tspan fill="#74C7EC">DBMS_OUTPUT</tspan>.<tspan fill="#EBA0AC">PUT_LINE</tspan>(v_total);</text>
  </g>

  <!-- options -->
  <rect x="248" y="318" width="550" height="58" rx="8" fill="#FBFCFD" stroke="#E6E9EE"/>
  <g class="t" font-size="12.5" fill="#3C424B">
    <rect x="262" y="332" width="14" height="14" rx="3" fill="#7719AA"/>
    <text x="885" y="344" fill="#ffffff" font-size="10" text-anchor="middle" opacity="0">.</text>
    <path d="M264.5 339 l3 3 l6 -6" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="282" y="344">行号</text>
    <text x="322" y="344" fill="#57606A" font-size="11.5">起始 1 · 步长 1 · 竖线 │ · 双列对齐</text>
    <rect x="262" y="356" width="14" height="14" rx="3" fill="#7719AA"/>
    <path d="M264.5 363 l3 3 l6 -6" stroke="#ffffff" stroke-width="2.2" fill="none"/>
    <text x="282" y="368">自动美化</text>
    <text x="346" y="368" fill="#57606A" font-size="11.5">缩进 4 空格 · 关键字大写 · AND/OR 对齐 · 主题: 浅色</text>
  </g>

  <!-- preview -->
  <text x="248" y="404" class="t" font-size="12" fill="#57606A">预览 Preview（与插入效果一致 · WYSIWYG）</text>
  <rect x="248" y="412" width="550" height="96" rx="8" fill="#FBFCFD" stroke="#D0D7DE"/>
  <rect x="248" y="412" width="550" height="24" rx="8" fill="#EEF0F3"/>
  <rect x="248" y="428" width="550" height="8" fill="#EEF0F3"/>
  <text x="264" y="429" class="m" font-size="12" font-weight="bold" fill="#3C424B">┌ get_orders.sql</text>
  <rect x="742" y="416" width="52" height="17" rx="9" fill="#FDEEE0"/>
  <text x="768" y="429" text-anchor="middle" class="t" font-size="10" font-weight="700" fill="#C2410C">PL/SQL</text>
  <g class="m" font-size="11.5">
    <text x="270" y="452" fill="#8B949E" text-anchor="end">1</text>
    <text x="278" y="452" fill="#E1E4E8">│</text>
    <text x="290" y="452" fill="#008000">-- 查询近 30 天已支付订单</text>
    <text x="270" y="470" fill="#8B949E" text-anchor="end">2</text>
    <text x="278" y="470" fill="#E1E4E8">│</text>
    <text x="290" y="470" fill="#0000FF" font-weight="bold">DECLARE</text>
    <text x="270" y="488" fill="#8B949E" text-anchor="end">3</text>
    <text x="278" y="488" fill="#E1E4E8">│</text>
    <text x="290" y="488" fill="#24292F" xml:space="preserve">   v_total <tspan fill="#267F99">NUMBER</tspan> <tspan fill="#24292F">:=</tspan> <tspan fill="#098658">0</tspan>;</text>
    <text x="270" y="503" fill="#8B949E" text-anchor="end">4</text>
    <text x="278" y="503" fill="#E1E4E8">│</text>
    <text x="290" y="503" fill="#0000FF" font-weight="bold">BEGIN</text>
  </g>

  <!-- footer -->
  <text x="248" y="528" class="t" font-size="11.5" fill="#8B949E">Ctrl+Enter 插入 · Esc 取消</text>
  <rect x="600" y="510" width="66" height="26" rx="6" fill="#F6F8FA" stroke="#C9D1D9"/>
  <text x="633" y="528" text-anchor="middle" class="t" font-size="12.5" fill="#24292F">取消</text>
  <rect x="674" y="508" width="94" height="28" rx="6" fill="#7719AA"/>
  <text x="721" y="527" text-anchor="middle" class="t" font-size="13" font-weight="700" fill="#ffffff">插入 (I)</text>
</svg>
